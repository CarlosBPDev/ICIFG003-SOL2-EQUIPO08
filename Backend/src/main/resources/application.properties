spring.application.name=back

# =============================================================================
# DDL: Hibernate genera automaticamente el esquema (sin scripts DDL).
# DML: data.sql contiene solo datos semilla (INSERTs), se ejecuta despues
#      de que Hibernate crea las tablas.
# =============================================================================

# Puerto del servidor
server.port=${PORT:6789}
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-binding-errors=always

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/demo01
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=1234

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Inicializacion: permite data.sql (DML) despues del DDL de Hibernate
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

