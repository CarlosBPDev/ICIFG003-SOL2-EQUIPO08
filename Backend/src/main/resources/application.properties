spring.application.name=back

# =============================================================================
# DDL: Hibernate genera automaticamente el esquema (sin scripts DDL).
# DML: data.sql contiene solo datos semilla (INSERTs), se ejecuta despues
#      de que Hibernate crea las tablas.
# =============================================================================

# Puerto del servidor
server.port=${PORT:6789}
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-binding-errors=always

# Conexion a MySQL (parametrizado para Docker y local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/demo01?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Logging a archivo
logging.file.name=backend.log
logging.level.com.example.demo=INFO
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Inicializacion: permite data.sql (DML) despues del DDL de Hibernate
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

