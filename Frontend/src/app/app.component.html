<header *ngIf="authService.isLoggedIn()">
  <nav class="app-navbar">
    <div class="nav-container">
      <div class="nav-logo">
        <span class="logo-icon" aria-hidden="true">🎓</span>
        <span class="logo-text">ReservaSalas</span>
      </div>
      <app-menu></app-menu>
      <div class="nav-user" *ngIf="authService.currentUser">
        <span class="user-name">{{ authService.currentUser.nombre }} {{ authService.currentUser.apellido }}</span>
        <button class="btn-logout" (click)="logout()" aria-label="Cerrar sesión">Cerrar Sesión</button>
      </div>
    </div>
  </nav>
</header>

<main class="app-content">
  <router-outlet></router-outlet>
</main>

<footer class="app-footer" *ngIf="authService.isLoggedIn()">
  <p>&copy; 2026 S2_ATW — ReservaSalas</p>
</footer>
