<article class="sala-card" tabindex="0" [attr.aria-label]="'Información de sala ' + sala.nombreSala">
  <div class="sala-img-placeholder" role="img" [attr.aria-label]="'Imagen de sala ' + sala.nombreSala + ' - Capacidad ' + sala.capacidad + ' personas'">
    <svg class="sala-icon-bg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 21h18"></path>
      <path d="M5 21V7l8-4v18"></path>
      <path d="M19 21V11l-6-3"></path>
      <path d="M9 9v.01"></path>
      <path d="M9 12v.01"></path>
      <path d="M9 15v.01"></path>
      <path d="M9 18v.01"></path>
    </svg>
    <span class="sala-img-code">{{ sala.codigoSala }}</span>
  </div>

  <div class="sala-card-body">
    <h3>{{ sala.nombreSala }}</h3>
    <p class="description">{{ sala.descripcion }}</p>

    <div class="spec-list">
      <div class="spec-item">
        <span class="icon">👥</span>
        <span>Capacidad: <strong>{{ sala.capacidad }} personas</strong></span>
      </div>
      <div class="spec-item">
        <span class="icon">🏢</span>
        <span>Edificio: <strong>{{ sala.edificio?.nombreEdificio || 'No especificado' }}</strong></span>
      </div>
      <div class="spec-item">
        <span class="icon">📍</span>
        <span>Piso: <strong>{{ sala.piso }}</strong></span>
      </div>
    </div>

    <section *ngIf="horarios.length > 0">
      <h4>Horarios disponibles:</h4>
      <ul>
        <li *ngFor="let h of horarios">
          {{ h.horaInicio | slice:0:5 }} - {{ h.horaTermino | slice:0:5 }}
        </li>
      </ul>
    </section>
  </div>

  <div class="sala-card-footer">
    <button class="btn-reserva" (click)="reservar()" [attr.aria-label]="'Reservar sala ' + sala.nombreSala">
      Reservar Sala
    </button>
  </div>
</article>
